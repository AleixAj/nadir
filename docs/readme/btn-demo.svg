<svg xmlns="http://www.w3.org/2000/svg" width="460" height="96" viewBox="0 0 460 96">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FB923C"/>
      <stop offset="1" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#C2410C" flood-opacity=".45"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <rect x="8" y="6" width="444" height="76" rx="20" fill="url(#bg)"/>
    <rect x="8" y="6" width="444" height="76" rx="20" fill="url(#shine)"/>
    <rect x="8.75" y="6.75" width="442.5" height="74.5" rx="19.25" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="1.5"/>
  </g>

  <!-- Play icon in a circle -->
  <circle cx="52" cy="44" r="22" fill="#fff" fill-opacity=".18"/>
  <path d="M46 34.5v19l15-9.5z" fill="#fff" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>

  <text x="88" y="42" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Probar la demo</text>
  <text x="88" y="64" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="14" fill="#fff" fill-opacity=".88">Sin registro · 12 productos con histórico</text>

  <!-- Arrow -->
  <path d="M404 44h24m-9-9 9 9-9 9" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
